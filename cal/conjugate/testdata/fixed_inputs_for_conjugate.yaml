# maxNollZern : int
#     The maximum Noll Zernike mode to include as part of the low-
#     order modes to split between DMs 1 and 2.
maxNollZern: 11
# nIterSmooth : int
#     Number of iterations to call the smoothing function to fill in the gaps
#     in the pupil WFE map.
nIterSmooth: 100
# nBin : int
#     Number of bins to use in AMPTHRESH when thresholding the amplitude map
#     from phase retrieval.
nBin: 21
# arrayExtFac : float
#     Factor multiplied by the beam size to create the DM surface's array
#     size. Set to larger than 1 to make sure the beam is not clipped if it
#     is not centered on the array.
arrayExtFac: 1.4
# bufferRadiusAct: float
#     Max number of actuators past the pupil outer radius to still include
#     when computing the flattening command. Past that they are zeroed out.
#     The purpose of this is to prevent the corner actuators from being very
#     high from modes like 45-degree astigmatism or defocus, which will drag
#     up/down the other actuators a lot if they are electrically ganged.
#     Must be >= 0.
bufferOuterRadiusAct: 4.0
